version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pdf_qa_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pdf_qa_backend
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=pdf_documents
    env_file:
      - .env
    depends_on:
      - qdrant
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pdf_qa_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

volumes:
  qdrant_storage:
